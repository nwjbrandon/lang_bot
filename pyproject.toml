[project]
name = "langbot"
version = "0.1.0"
description = "Shared framework and bots for language-study quizzes (JLPT vocab, EN/JA phrases) over LINE and Telegram."
requires-python = ">=3.13"
dependencies = [
    "requests==2.33.1",
    "pandas==3.0.2",
    "python-telegram-bot==22.7",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "ruff==0.12.10",
]

[tool.uv]
# Virtual workspace: run via ``python -m langbot.apps.<app>`` rather than
# installing the package. ``uv sync`` installs only the dependencies.
package = false
