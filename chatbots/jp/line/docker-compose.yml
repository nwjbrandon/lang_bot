services:
  jp-line-bot:
    build:
      # Build from the repo root so the shared langbot package is in context.
      context: ../../..
      dockerfile: Dockerfile
    image: jp-line-bot:latest
    container_name: jp-line-bot
    restart: unless-stopped
    environment:
      APP_MODULE: langbot.apps.jp_line
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data:ro
